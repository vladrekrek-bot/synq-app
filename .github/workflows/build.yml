name: Собрать SYNQ (iPhone + Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15-intel
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Нарисовать иконки
        run: |
          pip install pillow
          python resources/make_icon.py
      - name: Установить Capacitor
        run: npm install
      - name: Создать iOS-проект
        run: npx cap add ios
      - name: Иконка и настройки
        run: |
          set -e
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICONSET"/*.png; do cp resources/AppIcon-1024.png "$f"; done
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SYNQ" $PL || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string SYNQ" $PL
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Доступ к фото нужен, чтобы переносить их на компьютер'" $PL || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Чтобы сохранять фото, присланные с компьютера'" $PL || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Чтобы найти компьютер в твоей Wi-Fi сети'" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $PL || true
      - name: Синхронизировать веб-часть
        run: npx cap sync ios
      - name: Собрать без подписи
        run: |
          set -e
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tail -n 40
      - name: Упаковать IPA
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry SYNQ.ipa Payload
          ls -lh SYNQ.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: SYNQ.ipa

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Нарисовать иконки
        run: |
          pip install pillow
          python resources/make_icon.py
      - run: npm install
      - name: Собрать SYNQ-Windows.exe
        run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/SYNQ-Windows.exe

  release:
    needs: [ios, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SYNQ 1.0.${{ github.run_number }}
          body: |
            📱 iPhone: скачай SYNQ.ipa на айфоне → «Открыть в ESign» → подписать и установить.
            💻 Windows: скачай SYNQ-Windows.exe и запусти (установка не нужна).
          files: |
            SYNQ.ipa
            SYNQ-Windows.exe
          make_latest: true
